<svg viewBox="0 0 850 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ajay K J — Senior Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdae"/>
      <stop offset="0.5" stop-color="#70a5fd"/>
      <stop offset="1" stop-color="#bf91f3"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#70a5fd" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#70a5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bf91f3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bf91f3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="850" height="230" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="850" height="230" fill="url(#bg)"/>

    <!-- drifting aurora glows -->
    <ellipse cx="180" cy="70" rx="260" ry="170" fill="url(#glowA)">
      <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="150" rx="260" ry="170" fill="url(#glowB)">
      <animate attributeName="cx" values="700;560;700" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- twinkling stars -->
    <g fill="#c9d1d9">
      <circle cx="90" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="30" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="48" r="1.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="35" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="55" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="180" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="190" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="200" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- name + role -->
    <text x="48" y="98" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="1.5">Ajay K J</text>
    <rect x="50" y="116" width="300" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="0;300" dur="1.1s" fill="freeze"/>
    </rect>
    <text x="50" y="150" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="19" font-weight="600" fill="#70a5fd">Senior Software Engineer</text>
    <text x="50" y="178" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Angular &amp; Frontend Specialist &#183; Kochi, Kerala, India</text>

    <!-- bottom accent wave -->
    <path fill="url(#accent)" opacity="0.9" d="M0,210 C150,185 300,235 450,210 C600,185 750,235 900,210 L900,230 L0,230 Z">
      <animate attributeName="d"
        values="M0,210 C150,185 300,235 450,210 C600,185 750,235 900,210 L900,230 L0,230 Z;
                M0,212 C150,238 300,188 450,213 C600,238 750,188 900,213 L900,230 L0,230 Z;
                M0,210 C150,185 300,235 450,210 C600,185 750,235 900,210 L900,230 L0,230 Z"
        dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
