<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ajay K J — Senior Software Engineer">
  <title>Ajay K J — Senior Software Engineer</title>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03050d"/><stop offset="0.5" stop-color="#070414"/><stop offset="1" stop-color="#0b061c"/></linearGradient>
    <radialGradient id="nebTeal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.40"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="nebPurple" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.44"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="nebCyan" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9"/><stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="0.8" fill="#5eead4" opacity="0.08"/></pattern>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#space)"/>
    <ellipse cx="250" cy="170" rx="420" ry="280" fill="url(#nebTeal)"><animate attributeName="cx" values="250;360;250" dur="19s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;1;0.7" dur="9s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="960" cy="200" rx="440" ry="300" fill="url(#nebPurple)"><animate attributeName="cx" values="960;830;960" dur="23s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="640" cy="110" rx="380" ry="240" fill="url(#nebCyan)"><animate attributeName="cy" values="110;190;110" dur="17s" repeatCount="indefinite"/></ellipse>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- architecture nodes right -->
    <g stroke="#2dd4bf" stroke-width="0.7">
      <line x1="930" y1="68" x2="1030" y2="115"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/></line>
      <line x1="1030" y1="115" x2="1110" y2="76"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/></line>
      <line x1="1030" y1="115" x2="1095" y2="198"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="7s" repeatCount="indefinite"/></line>
      <line x1="1095" y1="198" x2="980" y2="248"><animate attributeName="opacity" values="0.1;0.32;0.1" dur="6.4s" repeatCount="indefinite"/></line>
    </g>
    <g fill="#22d3ee">
      <circle cx="930" cy="68" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="115" r="4" fill="#a855f7"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="76" r="2.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1095" cy="198" r="3" fill="#2dd4bf"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="248" r="2.5" fill="#a855f7"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- code streams left -->
    <g font-family="'Fira Code','Cascadia Code',monospace" font-size="14.5" font-weight="500">
      <text y="84" fill="#5eead4"><tspan x="28">&lt;angular/&gt;</tspan><animate attributeName="opacity" values="0;0.78;0" dur="7s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;80,0" dur="7s" begin="0s" repeatCount="indefinite"/></text>
      <text y="126" fill="#22d3ee"><tspan x="40">rxjs.observe()</tspan><animate attributeName="opacity" values="0;0.72;0" dur="8s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;95,0" dur="8s" begin="1.2s" repeatCount="indefinite"/></text>
      <text y="168" fill="#a78bfa"><tspan x="24">function buildMicro()</tspan><animate attributeName="opacity" values="0;0.68;0" dur="9s" begin="2.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;90,0" dur="9s" begin="2.5s" repeatCount="indefinite"/></text>
      <text y="210" fill="#5eead4"><tspan x="42">export class</tspan><animate attributeName="opacity" values="0;0.75;0" dur="7.5s" begin="0.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;85,0" dur="7.5s" begin="0.8s" repeatCount="indefinite"/></text>
      <text y="252" fill="#22d3ee"><tspan x="28">signal&lt;State&gt;</tspan><animate attributeName="opacity" values="0;0.70;0" dur="8.5s" begin="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;92,0" dur="8.5s" begin="3s" repeatCount="indefinite"/></text>
    </g>

    <!-- particles -->
    <g fill="#5eead4">
      <circle cx="430" cy="58" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="278" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="298" r="1.3" fill="#a78bfa"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="48" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- name + position right-aligned, NO box -->
    <text x="1165" y="168" text-anchor="end" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="58" font-weight="800" fill="url(#nameGrad)" letter-spacing="7" filter="url(#glow)">AJAY K J</text>
    <rect x="915" y="183" height="2" rx="1" fill="url(#ul)">
      <animate attributeName="width" values="0;250" dur="1.1s" fill="freeze"/>
    </rect>
    <text x="1165" y="216" text-anchor="end" font-family="'Fira Code',monospace"
          font-size="16.5" font-weight="600" fill="#5eead4" letter-spacing="4">SENIOR SOFTWARE ENGINEER</text>

    <!-- HUD corners -->
    <path d="M30,30 L30,68 M30,30 L68,30" stroke="#2dd4bf" stroke-width="2" opacity="0.5" fill="none"/>
    <path d="M1170,310 L1170,272 M1170,310 L1132,310" stroke="#a855f7" stroke-width="2" opacity="0.5" fill="none"/>
  </g>
</svg>
