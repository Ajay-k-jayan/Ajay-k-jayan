<svg viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ajay K J — Senior Software Engineer">
  <title>Ajay K J — Senior Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d18"/><stop offset="1" stop-color="#0b0f1c"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="#adbac7" opacity="0.13"/>
    </pattern>
    <radialGradient id="rA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#70a5fd" stop-opacity="0.52"/><stop offset="1" stop-color="#70a5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bf91f3" stop-opacity="0.46"/><stop offset="1" stop-color="#bf91f3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdae" stop-opacity="0.38"/><stop offset="1" stop-color="#38bdae" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdae"/><stop offset="0.5" stop-color="#70a5fd"/><stop offset="1" stop-color="#bf91f3"/>
    </linearGradient>
    <linearGradient id="vbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdae"/><stop offset="0.5" stop-color="#70a5fd"/><stop offset="1" stop-color="#bf91f3"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/><stop offset="0.45" stop-color="#79c0ff"/><stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="250" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="250" fill="url(#bg)"/>
    <rect width="1000" height="250" fill="url(#dots)"/>

    <!-- aurora blobs -->
    <ellipse cx="230" cy="105" rx="330" ry="210" fill="url(#rA)">
      <animate attributeName="cx" values="230;400;230" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="105;155;105" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="790" cy="148" rx="310" ry="200" fill="url(#rB)">
      <animate attributeName="cx" values="790;640;790" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="148;180;148" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="520" cy="230" rx="290" ry="150" fill="url(#rC)">
      <animate attributeName="cx" values="520;320;700;520" dur="25s" repeatCount="indefinite"/>
    </ellipse>

    <!-- animated scan dashes -->
    <line x1="0" y1="80" x2="1000" y2="80" stroke="#70a5fd" stroke-width="0.7" stroke-dasharray="10,22" opacity="0.11">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="172" x2="1000" y2="172" stroke="#bf91f3" stroke-width="0.7" stroke-dasharray="10,22" opacity="0.11">
      <animate attributeName="stroke-dashoffset" values="0;160" dur="6.5s" repeatCount="indefinite"/>
    </line>

    <!-- upper constellation stars -->
    <g fill="#c9d1d9">
      <circle cx="128" cy="26" r="1.9"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="295" cy="44" r="1.4"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="468" cy="20" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.0s" repeatCount="indefinite"/></circle>
      <circle cx="628" cy="38" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="748" cy="19" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="872" cy="36" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="962" cy="16" r="1.2"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <!-- lower constellation stars -->
    <g fill="#c9d1d9">
      <circle cx="82" cy="218" r="1.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="348" cy="228" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="546" cy="214" r="1.4"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="706" cy="230" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="845" cy="212" r="1.2"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="2.7s" repeatCount="indefinite"/></circle>
    </g>
    <!-- constellation connector lines -->
    <g stroke="#8b949e" stroke-width="0.5">
      <line x1="128" y1="26" x2="295" y2="44"><animate attributeName="opacity" values="0.04;0.22;0.04" dur="6s" repeatCount="indefinite"/></line>
      <line x1="295" y1="44" x2="468" y2="20"><animate attributeName="opacity" values="0.04;0.18;0.04" dur="7.5s" repeatCount="indefinite"/></line>
      <line x1="628" y1="38" x2="748" y2="19"><animate attributeName="opacity" values="0.04;0.20;0.04" dur="5.5s" repeatCount="indefinite"/></line>
      <line x1="748" y1="19" x2="872" y2="36"><animate attributeName="opacity" values="0.04;0.18;0.04" dur="8s" repeatCount="indefinite"/></line>
      <line x1="348" y1="228" x2="546" y2="214"><animate attributeName="opacity" values="0.04;0.20;0.04" dur="6.5s" repeatCount="indefinite"/></line>
      <line x1="546" y1="214" x2="706" y2="230"><animate attributeName="opacity" values="0.04;0.16;0.04" dur="7s" repeatCount="indefinite"/></line>
    </g>

    <!-- decorative background symbols -->
    <text x="810" y="178" font-family="monospace" font-size="96" font-weight="800" fill="#70a5fd" opacity="0.038">{ }</text>
    <text x="28" y="195" font-family="monospace" font-size="68" font-weight="800" fill="#38bdae" opacity="0.038">&lt;/&gt;</text>

    <!-- vertical accent bar -->
    <rect x="48" y="62" width="4" height="128" rx="2" fill="url(#vbar)" filter="url(#softglow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- name with gradient fill + glow -->
    <text x="72" y="132" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="62" font-weight="800" fill="url(#nameG)"
          filter="url(#glow)" letter-spacing="2">Ajay K J</text>

    <!-- animated accent underline -->
    <rect x="72" y="144" width="360" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;360" dur="1.1s" fill="freeze"/>
    </rect>

    <!-- role text -->
    <text x="74" y="172" font-family="'Fira Code','Cascadia Code',Consolas,monospace"
          font-size="16" font-weight="600" fill="#79c0ff" letter-spacing="1.2">Senior Software Engineer</text>

    <!-- blinking terminal cursor -->
    <rect x="332" y="155" width="10" height="19" rx="1" fill="#79c0ff">
      <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- subtitle -->
    <text x="74" y="198" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="13.5" fill="#8b949e">Angular · TypeScript · RxJS · Kochi, Kerala, India</text>

    <!-- animated bottom wave -->
    <path fill="url(#accent)" opacity="0.88"
          d="M0,218 C180,194 360,242 540,218 C720,194 880,240 1060,216 L1060,250 L0,250 Z">
      <animate attributeName="d"
        values="M0,218 C180,194 360,242 540,218 C720,194 880,240 1060,216 L1060,250 L0,250 Z;
                M0,220 C180,244 360,196 540,220 C720,244 880,198 1060,222 L1060,250 L0,250 Z;
                M0,218 C180,194 360,242 540,218 C720,194 880,240 1060,216 L1060,250 L0,250 Z"
        dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
