<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ajay K J — Senior Software Engineer">
  <title>Ajay K J — Senior Software Engineer · Architecture &amp; Innovation</title>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050d"/><stop offset="0.5" stop-color="#070414"/><stop offset="1" stop-color="#0b061c"/>
    </linearGradient>
    <radialGradient id="nebTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.42"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="brk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="0.8" fill="#5eead4" opacity="0.09"/>
    </pattern>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tglow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="400" fill="url(#space)"/>

    <!-- nebula -->
    <ellipse cx="260" cy="190" rx="430" ry="300" fill="url(#nebTeal)">
      <animate attributeName="cx" values="260;380;260" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="240" rx="460" ry="320" fill="url(#nebPurple)">
      <animate attributeName="cx" values="960;830;960" dur="23s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="660" cy="120" rx="400" ry="270" fill="url(#nebCyan)">
      <animate attributeName="cy" values="120;210;120" dur="17s" repeatCount="indefinite"/>
    </ellipse>

    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- network architecture nodes (background) -->
    <g stroke="#2dd4bf" stroke-width="0.7" opacity="0.5">
      <line x1="930" y1="70" x2="1030" y2="120"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/></line>
      <line x1="1030" y1="120" x2="1110" y2="80"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/></line>
      <line x1="1030" y1="120" x2="1090" y2="200"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="7s" repeatCount="indefinite"/></line>
      <line x1="120" y1="330" x2="240" y2="300"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="6.5s" repeatCount="indefinite"/></line>
      <line x1="240" y1="300" x2="180" y2="360"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="5.5s" repeatCount="indefinite"/></line>
    </g>
    <g fill="#22d3ee">
      <circle cx="930" cy="70" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="120" r="4" fill="#a855f7"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="80" r="2.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="200" r="3" fill="#2dd4bf"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="330" r="3" fill="#2dd4bf"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="300" r="2.5" fill="#a855f7"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="360" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- flowing code streams (left cosmic river) -->
    <g font-family="'Fira Code','Cascadia Code',monospace" font-size="15" font-weight="500">
      <text y="95" fill="#5eead4">
        <tspan x="30">&lt;angular/&gt;</tspan>
        <animate attributeName="opacity" values="0;0.75;0" dur="7s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;90,0" dur="7s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text y="135" fill="#22d3ee">
        <tspan x="40">rxjs -&gt; observe()</tspan>
        <animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="1.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;110,0" dur="8s" begin="1.2s" repeatCount="indefinite"/>
      </text>
      <text y="180" fill="#a78bfa">
        <tspan x="25">function buildMicro()</tspan>
        <animate attributeName="opacity" values="0;0.68;0" dur="9s" begin="2.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;100,0" dur="9s" begin="2.5s" repeatCount="indefinite"/>
      </text>
      <text y="225" fill="#5eead4">
        <tspan x="45">@Component({ })</tspan>
        <animate attributeName="opacity" values="0;0.72;0" dur="7.5s" begin="0.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;95,0" dur="7.5s" begin="0.8s" repeatCount="indefinite"/>
      </text>
      <text y="270" fill="#22d3ee">
        <tspan x="30">signal&lt;State&gt;()</tspan>
        <animate attributeName="opacity" values="0;0.7;0" dur="8.5s" begin="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;105,0" dur="8.5s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text y="315" fill="#a78bfa">
        <tspan x="50">async | pipe</tspan>
        <animate attributeName="opacity" values="0;0.66;0" dur="7.8s" begin="1.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;90,0" dur="7.8s" begin="1.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- floating particles -->
    <g fill="#5eead4">
      <circle cx="500" cy="60" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="340" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="350" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="350" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="320" r="1.4" fill="#a78bfa"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- holographic brackets framing the name -->
    <text x="470" y="295" font-family="monospace" font-size="330" font-weight="300" fill="url(#brk)" opacity="0.20" filter="url(#bloom)">{</text>
    <text x="1015" y="295" font-family="monospace" font-size="330" font-weight="300" fill="url(#brk)" opacity="0.20" filter="url(#bloom)">}</text>

    <!-- name plate (glassmorphism) -->
    <rect x="600" y="150" width="440" height="78" rx="12" fill="#070414" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="820" y="207" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="50" font-weight="800" fill="url(#nameGrad)" letter-spacing="7" filter="url(#tglow)">AJAY K J</text>

    <!-- subtitle plate -->
    <rect x="638" y="240" width="364" height="36" rx="9" fill="#070414" fill-opacity="0.45" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1"/>
    <text x="820" y="264" text-anchor="middle" font-family="'Fira Code',monospace" font-size="15" font-weight="600" fill="#5eead4" letter-spacing="3.5">SENIOR SOFTWARE ENGINEER</text>

    <!-- tagline -->
    <text x="820" y="305" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="14" fill="#8b8ba7" letter-spacing="2">ARCHITECTURE · INNOVATION · SCALE</text>

    <!-- corner accents -->
    <path d="M30,30 L30,70 M30,30 L70,30" stroke="#2dd4bf" stroke-width="2" opacity="0.5" fill="none"/>
    <path d="M1170,370 L1170,330 M1170,370 L1130,370" stroke="#a855f7" stroke-width="2" opacity="0.5" fill="none"/>
  </g>
</svg>
