<svg viewBox="0 0 850 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0516"/>
      <stop offset="1" stop-color="#0a0618"/>
    </linearGradient>
    <linearGradient id="fwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="fround"><rect width="850" height="150" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#fround)">
    <rect width="850" height="150" fill="url(#fbg)"/>

    <!-- layered animated waves -->
    <path fill="url(#fwave)" opacity="0.25" d="M0,60 C200,30 400,90 600,60 C750,38 850,70 900,55 L900,150 L0,150 Z">
      <animate attributeName="d"
        values="M0,60 C200,30 400,90 600,60 C750,38 850,70 900,55 L900,150 L0,150 Z;
                M0,62 C200,92 400,32 600,62 C750,86 850,40 900,60 L900,150 L0,150 Z;
                M0,60 C200,30 400,90 600,60 C750,38 850,70 900,55 L900,150 L0,150 Z"
        dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#fwave)" opacity="0.9" d="M0,95 C150,75 320,120 480,98 C640,76 760,118 900,96 L900,150 L0,150 Z">
      <animate attributeName="d"
        values="M0,95 C150,75 320,120 480,98 C640,76 760,118 900,96 L900,150 L0,150 Z;
                M0,97 C150,118 320,73 480,100 C640,121 760,74 900,99 L900,150 L0,150 Z;
                M0,95 C150,75 320,120 480,98 C640,76 760,118 900,96 L900,150 L0,150 Z"
        dur="7s" repeatCount="indefinite"/>
    </path>

    <text x="425" y="48" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#22d3ee">Thanks for visiting! &#9889;</text>
    <text x="425" y="74" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" fill="#8b949e">Angular &#183; TypeScript &#183; Frontend Engineering</text>
  </g>
</svg>
