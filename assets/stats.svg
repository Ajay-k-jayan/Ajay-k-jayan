<svg viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0a20"/><stop offset="1" stop-color="#08060f"/></linearGradient>
    <linearGradient id="n0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="n1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0883e"/><stop offset="1" stop-color="#db6d28"/></linearGradient><linearGradient id="n2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="n3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0ea5a4"/></linearGradient><linearGradient id="n4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b341"/><stop offset="1" stop-color="#d4a017"/></linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="180" rx="16" fill="url(#sbg)" stroke="#2dd4bf" stroke-opacity="0.18"/>
  <text x="32" y="40" font-family="monospace" font-size="14" font-weight="700" fill="#8b8ba7">// github stats</text>
  <circle cx="170" cy="35" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
  <rect x="22" y="62" width="182" height="98" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#22d3ee" stroke-opacity="0.35"/>
  <rect x="38" y="62" width="150" height="3" rx="1.5" fill="url(#n0)"/>
  <text x="113.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="url(#n0)" filter="url(#g)">248</text>
  <text x="113.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#e2e8f0">Commits</text>
  <rect x="218" y="62" width="182" height="98" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#f0883e" stroke-opacity="0.35"/>
  <rect x="234" y="62" width="150" height="3" rx="1.5" fill="url(#n1)"/>
  <text x="309.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="url(#n1)" filter="url(#g)">0</text>
  <text x="309.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#e2e8f0">Stars</text>
  <rect x="414" y="62" width="182" height="98" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#a855f7" stroke-opacity="0.35"/>
  <rect x="430" y="62" width="150" height="3" rx="1.5" fill="url(#n2)"/>
  <text x="505.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="url(#n2)" filter="url(#g)">0</text>
  <text x="505.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#e2e8f0">Pull Reqs</text>
  <rect x="610" y="62" width="182" height="98" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#2dd4bf" stroke-opacity="0.35"/>
  <rect x="626" y="62" width="150" height="3" rx="1.5" fill="url(#n3)"/>
  <text x="701.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="url(#n3)" filter="url(#g)">8</text>
  <text x="701.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#e2e8f0">Repos</text>
  <rect x="806" y="62" width="182" height="98" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#e3b341" stroke-opacity="0.35"/>
  <rect x="822" y="62" width="150" height="3" rx="1.5" fill="url(#n4)"/>
  <text x="897.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="url(#n4)" filter="url(#g)">2</text>
  <text x="897.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#e2e8f0">Followers</text>
