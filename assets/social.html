<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,pts=[];
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
function init(){pts=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}));}
function draw(){x.clearRect(0,0,W,H);for(let p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.beginPath();x.arc(p.x,p.y,1.8,0,Math.PI*2);x.fillStyle='rgba(45,212,191,.55)';x.fill();}
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.strokeStyle=`rgba(168,85,247,${.25*(1-d/120)})`;x.lineWidth=.8;x.stroke();}}requestAnimationFrame(draw);}
resize();init();draw();window.addEventListener('resize',()=>{resize();init();});
</script>
