  <circle cx="680" cy="120" r="6.5" fill="url(#starC)" filter="url(#cglow)"/>
  <circle cx="680" cy="120" r="2.9250000000000003" fill="#ffffff"/>
  <text x="680" y="142" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">JavaScript</text>
  <circle cx="850" cy="180" r="14.399999999999999" fill="url(#star)" opacity="0.5"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="180" r="6" fill="url(#star)" filter="url(#cglow)"/>
  <circle cx="850" cy="180" r="2.7" fill="#ffffff"/>
  <text x="850" y="202" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">Node.js</text>
  <circle cx="250" cy="260" r="14.399999999999999" fill="url(#starC)" opacity="0.5"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="260" r="6" fill="url(#starC)" filter="url(#cglow)"/>
  <circle cx="250" cy="260" r="2.7" fill="#ffffff"/>
  <text x="250" y="244" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">React</text>
  <circle cx="430" cy="300" r="15.6" fill="url(#starV)" opacity="0.5"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.6s" repeatCount="indefinite"/></circle>
  <circle cx="430" cy="300" r="6.5" fill="url(#starV)" filter="url(#cglow)"/>
  <circle cx="430" cy="300" r="2.9250000000000003" fill="#ffffff"/>
  <text x="430" y="284" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">Micro‑FE</text>
