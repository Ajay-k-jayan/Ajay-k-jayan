    <line x1="320" y1="110" x2="500" y2="160"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/></line>
    <line x1="500" y1="160" x2="680" y2="120"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="5.5s" repeatCount="indefinite"/></line>
    <line x1="680" y1="120" x2="850" y2="180"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="6.5s" repeatCount="indefinite"/></line>
