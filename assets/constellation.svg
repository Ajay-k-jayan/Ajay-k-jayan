  <circle cx="620" cy="290" r="5.5" fill="url(#star)" filter="url(#cglow)"/>
  <circle cx="620" cy="290" r="2.475" fill="#ffffff"/>
  <text x="620" y="274" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">D3.js</text>
