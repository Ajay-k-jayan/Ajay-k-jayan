<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skill constellation">
  <defs>
    <radialGradient id="cnsBg" cx="0.5" cy="0.4" r="0.8"><stop offset="0" stop-color="#0c0a22"/><stop offset="1" stop-color="#050410"/></radialGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#5eead4"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="starV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#c4b5fd"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="starC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="cglow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1000" height="380" rx="18" fill="url(#cnsBg)" stroke="#2dd4bf" stroke-opacity="0.18"/>
  <text x="32" y="40" font-family="'Fira Code',monospace" font-size="14" font-weight="700" fill="#8b8ba7">// skill constellation</text>
  <circle cx="218" cy="35" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>

